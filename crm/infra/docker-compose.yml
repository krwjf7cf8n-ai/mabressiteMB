# Sprint 7 (infra) — stack de produção/staging do CRM Mabres.
#
# Um mesmo arquivo serve os dois ambientes; o que os isola é o nome do
# projeto Compose (-p) e o arquivo de variáveis (--env-file), nunca o
# arquivo YAML. Ver docs/ops/deploy.md para o comando completo.
#
# Exemplo (produção):
#   docker compose --env-file infra/.env.production -p mabres-production \
#     -f infra/docker-compose.yml up -d
#
# Exemplo (staging):
#   docker compose --env-file infra/.env.staging -p mabres-staging \
#     -f infra/docker-compose.yml up -d

# Rotação de log local (driver json-file, padrão do Docker): cada linha de
# log já sai como um envelope JSON (timestamp, stream, log), então "logs
# estruturados" aqui é resolvido no nível do Docker, sem precisar reescrever
# os console.log/console.error já existentes na aplicação (fora do escopo
# operacional deste sprint — ver docs/ops/troubleshooting.md). O limite de
# tamanho/quantidade evita que os logs enchem o disco do VPS sozinhos.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      TZ: UTC
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    # --save periódico (RDB): perder o cache de rate-limit/filas em um
    # restart raro é aceitável (filas são recriadas no bootstrap do worker —
    # ver apps/worker/src/index.ts); não usamos AOF para manter o serviço
    # simples, conforme o orçamento/operação enxuta do ADR 0001/0002.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--save", "60", "100"]
    environment:
      # Só para o healthcheck abaixo ler via $$REDIS_PASSWORD dentro do
      # container — a senha real é passada ao redis-server via --requirepass.
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]

  # Job one-shot: aplica migrations pendentes (prisma migrate deploy — nunca
  # migrate dev) e encerra. web/worker só sobem depois dele terminar com
  # sucesso (depends_on: condition: service_completed_successfully).
  migrate:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    image: mabres-web:${IMAGE_TAG:-local}
    restart: "no"
    environment:
      TZ: UTC
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    entrypoint: ["pnpm", "--filter", "@mabres/db", "exec", "prisma", "migrate", "deploy"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    image: mabres-web:${IMAGE_TAG:-local}
    restart: unless-stopped
    logging: *default-logging
    environment:
      TZ: UTC
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      APP_URL: ${APP_URL}
      NEXTAUTH_URL: ${APP_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      SENTRY_DSN: ${SENTRY_DSN:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [internal, edge]

  worker:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    image: mabres-worker:${IMAGE_TAG:-local}
    restart: unless-stopped
    logging: *default-logging
    environment:
      TZ: UTC
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      SENTRY_DSN: ${SENTRY_DSN:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    # dá tempo do handler de SIGTERM (apps/worker/src/index.ts) fechar
    # Worker/Queue/conexão Redis antes do container ser morto.
    stop_grace_period: 30s
    networks: [internal]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    networks: [edge]

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:

networks:
  # postgres/redis/migrate/web/worker só se enxergam aqui — nada além do
  # Caddy fica exposto na rede "edge" (que é a única com portas publicadas
  # no host).
  internal:
  edge:
