name: CRM CI

on:
  pull_request:
    paths:
      - "crm/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch: {}

# Menor privilégio: o GITHUB_TOKEN só precisa ler o repositório para clonar e
# rodar lint/typecheck/test/build. Nenhum job desta pipeline escreve de volta
# no repositório (não há publicação de artifact, comentário automático ou
# push), então não há necessidade de nenhum escopo além de leitura.
permissions:
  contents: read

defaults:
  run:
    working-directory: crm

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "10"

jobs:
  secrets-check:
    name: Verificação de .env e segredos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Falhar se algum arquivo .env real estiver versionado
        run: |
          # .env.example é permitido; qualquer outro .env* rastreado pelo git falha o build
          if git ls-files | grep -E '(^|/)\.env(\.[a-zA-Z0-9_-]+)?$' | grep -v '\.env\.example$'; then
            echo "Arquivo .env real encontrado no repositório. Remova e rotacione qualquer segredo exposto."
            exit 1
          fi
          echo "OK: nenhum .env real versionado."

      - name: Busca best-effort por padrões óbvios de segredo no diff
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          # Sprint 8 (homologação) — bug real encontrado: com checkout raso
          # (fetch-depth: 1, padrão do actions/checkout), nem HEAD nem
          # origin/<base> trazem histórico suficiente para o git calcular um
          # merge-base, então o diff de três pontos (A...B) sempre falhava
          # aqui ("no merge base", exit 128) — este job nunca chegou a rodar
          # o grep de segredo de verdade no GitHub Actions. Diff de dois
          # pontos (A B) compara as duas árvores diretamente, sem precisar de
          # ancestralidade comum, e é a comparação que este job realmente
          # quer ("o que mudou em relação à base").
          DIFF=$(git diff "origin/${{ github.base_ref }}" HEAD -- . ':(exclude)crm/pnpm-lock.yaml')
          if echo "$DIFF" | grep -iE "(AIza[0-9A-Za-z_-]{20,}|sk-[a-zA-Z0-9]{20,}|EAACEdEose0cBA|-----BEGIN [A-Z ]*PRIVATE KEY-----)"; then
            echo "Padrão que se parece com chave/segredo real encontrado no diff. Revise antes de prosseguir."
            exit 1
          fi
          echo "OK: nenhum padrão óbvio de segredo encontrado."

      - name: Falhar se houver test.only/it.only/describe.only esquecido (Vitest/Playwright)
        run: |
          # test.only/it.only/describe.only (e as variantes .skip inversas) rodam só um
          # subconjunto da suíte — útil ao depurar localmente, mas perigoso se commitado:
          # o CI passaria "verde" tendo executado só uma fração dos testes.
          MATCHES=$(git ls-files -- ':(glob)**/*.test.ts' ':(glob)**/*.spec.ts' | xargs grep -nE '\b(test|it|describe)\.only\(' || true)
          if [ -n "$MATCHES" ]; then
            echo "test.only/it.only/describe.only encontrado — remova antes de commitar:"
            echo "$MATCHES"
            exit 1
          fi
          echo "OK: nenhum .only esquecido em arquivos de teste."

  install-and-static-checks:
    name: Install, lint e typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: crm/pnpm-lock.yaml

      - name: Instala dependências (lockfile obrigatório)
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Gera Prisma Client (necessário para o typecheck resolver os tipos)
        run: pnpm db:generate
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/mabres_ci_placeholder"

      - name: Typecheck
        run: pnpm typecheck

  test-and-migrations:
    name: Testes, migrations e build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mabres_crm_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Sprint 8 (homologação) — faltava aqui: apps/worker/src/queue.test.ts
      # (integração real com BullMQ) sempre falhou neste job no GitHub
      # Actions por falta de REDIS_URL/serviço Redis (só rodava localmente,
      # onde REDIS_URL já estava exportado no shell). Nunca foi um problema
      # do teste em si.
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mabres_crm_ci
      REDIS_URL: redis://localhost:6379
      NEXTAUTH_SECRET: ci-only-secret-not-for-production
      NEXTAUTH_URL: http://localhost:3000
      APP_URL: http://localhost:3000
      ENCRYPTION_KEY: ci-only-encryption-key-not-for-production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: crm/pnpm-lock.yaml

      - name: Instala dependências (lockfile obrigatório)
        run: pnpm install --frozen-lockfile

      - name: Gera Prisma Client
        run: pnpm db:generate

      - name: Aplica migrations no banco de CI
        run: pnpm --filter @mabres/db exec prisma migrate deploy

      - name: Valida que o schema não diverge das migrations commitadas
        run: |
          pnpm --filter @mabres/db exec prisma migrate diff \
            --from-url "$DATABASE_URL" \
            --to-schema-datamodel prisma/schema.prisma \
            --exit-code

      - name: Testes automatizados (unit + integração)
        run: pnpm test

      - name: Build de produção (apps/web)
        run: pnpm --filter @mabres/web build

      - name: Build do worker
        run: pnpm --filter @mabres/worker build

  e2e-security-specs:
    name: E2E — controle de acesso e escopo (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mabres_crm_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Sprint 8 (homologação) — faltava aqui: sem REDIS_URL, o rate limiting
      # de login (G22) roda em modo "fail open" (ver apps/web/lib/rate-limit.ts)
      # e o teste "bloqueia após 5 tentativas..." sempre falhou neste job no
      # GitHub Actions. O comportamento fail-open em si está correto (Redis
      # fora do ar não deve travar o login) — o que faltava era o serviço
      # Redis para validar o caminho normal (Redis no ar) neste job.
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mabres_crm_e2e
      REDIS_URL: redis://localhost:6379
      NEXTAUTH_SECRET: ci-only-secret-not-for-production
      NEXTAUTH_URL: http://localhost:3000
      APP_URL: http://localhost:3000
      ENCRYPTION_KEY: ci-only-encryption-key-not-for-production
      E2E_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: crm/pnpm-lock.yaml

      - name: Instala dependências (lockfile obrigatório)
        run: pnpm install --frozen-lockfile

      - name: Gera Prisma Client
        run: pnpm db:generate

      - name: Aplica migrations no banco de E2E
        run: pnpm --filter @mabres/db exec prisma migrate deploy

      - name: Popula papéis, permissões e etapas do funil (necessário para login/RBAC)
        run: pnpm db:seed

      - name: Instala o Chromium do Playwright
        working-directory: crm/apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: Build de produção (apps/web)
        run: pnpm --filter @mabres/web build

      - name: Sobe a aplicação em modo produção (next start)
        working-directory: crm/apps/web
        run: |
          nohup pnpm start > /tmp/next-start.log 2>&1 &
          disown
          echo $! > /tmp/next-start.pid

      - name: Aguarda a aplicação responder antes de rodar os testes
        run: |
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null "$E2E_BASE_URL/login"; then
              echo "Aplicação pronta."
              exit 0
            fi
            sleep 2
          done
          echo "Aplicação não respondeu a tempo em $E2E_BASE_URL/login"
          exit 1

      - name: Testes E2E de segurança e controle de acesso
        working-directory: crm/apps/web
        run: pnpm e2e

      - name: Mostra o log da aplicação em caso de falha
        if: failure()
        run: cat /tmp/next-start.log || true

      - name: Encerra a aplicação
        if: always()
        run: kill "$(cat /tmp/next-start.pid)" 2>/dev/null || true

      - name: Publica trace/screenshot em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            crm/apps/web/test-results
            crm/apps/web/playwright-report
          retention-days: 7

  dependency-audit:
    name: Auditoria básica de dependências
    runs-on: ubuntu-latest
    continue-on-error: true # informativo nesta fase; não bloqueia o PR
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: crm/pnpm-lock.yaml

      - name: Instala dependências (lockfile obrigatório)
        run: pnpm install --frozen-lockfile

      - name: pnpm audit (nível alto)
        run: pnpm audit --audit-level=high
